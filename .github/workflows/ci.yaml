name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      # Add any environment variables needed to run baton-bitbucket-datacenter
      BATON_DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      BATON_DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BATON_ACCOUNT_ID: ${{ secrets.BATON_ACCOUNT_ID }}
      # BATON_WORKSPACES: ${{ secrets.BATON_WORKSPACES }}
      # BATON_WORKSPACE_TOKENS: ${{ secrets.BATON_WORKSPACE_TOKENS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-databricks
        run: go build ./cmd/baton-databricks
      - name: Test grant/revoking entitlements
        env:
          BATON_DATABRICKS: ./baton-databricks
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-databricks
          baton-entitlement: 'group:account/8c6f99ec-78ce-4654-8f92-e716b3dd67a7/group/66271399072731:member'
          baton-principal: '5346803201281760'
          baton-principal-type: 'user'
      # Runs only when repo variable TEST_ACTION_USER_ID names a dedicated, active QA account user
      # (numeric SCIM user ID). Disable then enable, twice each, so the user ends active and
      # the second call of each action exercises idempotency.
      - name: Test enable_user/disable_user actions
        if: ${{ vars.TEST_ACTION_USER_ID != '' }}
        env:
          TEST_ACTION_USER_ID: ${{ vars.TEST_ACTION_USER_ID }}
        run: |
          set -euo pipefail
          trap './baton-databricks --invoke-action=enable_user --invoke-action-args="{\"user_id\":\"${TEST_ACTION_USER_ID}\"}"' EXIT
          for action in disable_user disable_user enable_user enable_user; do
            ./baton-databricks --invoke-action="${action}" --invoke-action-args="{\"user_id\":\"${TEST_ACTION_USER_ID}\"}"
          done
